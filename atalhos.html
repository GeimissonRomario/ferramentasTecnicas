<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atalhos de Teclado</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;if(t==='dark'||(t===null&&d))document.documentElement.classList.add('dark-theme');})()</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Atalhos de Teclado do Windows</h1>
    <p>Atalhos úteis para aumentar a produtividade</p>
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i> Voltar</a>
    <button class="theme-toggle" id="themeToggle"><i data-lucide="moon"></i></button>
  </header>

  <main class="container atalhos-container">
    <div class="search-container">
      <input type="text" id="searchAtalhos" placeholder="Buscar atalhos..." class="search-input">
      <span class="search-counter" id="searchCounter"></span>
    </div>

    <div class="atalhos-grid" id="atalhosGrid">
      <!-- Os atalhos serão inseridos aqui via JavaScript -->
    </div>
  </main>

  <footer class="footer">
    <small>Feito por Geimisson Romário — versão web (simulador)</small>
  </footer>

    <script src="notification.js"></script>
    <script src="atalhos.js"></script>
    <script src="theme.js"></script>
  <script>if(typeof lucide!=="undefined")lucide.createIcons();</script>
</body>
</html>
