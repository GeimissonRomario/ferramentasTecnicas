<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas Rápidas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;if(t==='dark'||(t===null&&d))document.documentElement.classList.add('dark-theme');})()</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Notas Rápidas</h1>
    <p>Anotações salvas automaticamente no navegador</p>
    <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i> Voltar</a>
    <button class="theme-toggle" id="themeToggle"><i data-lucide="moon"></i></button>
  </header>

  <main class="container notas-container">
    <div class="notas-toolbar">
      <span class="notas-status" id="notasStatus">Nenhuma nota ainda</span>
      <div class="notas-actions">
        <button class="notas-btn secondary" id="copiarBtn"><i data-lucide="copy"></i> Copiar tudo</button>
        <button class="notas-btn secondary" id="exportarBtn"><i data-lucide="download"></i> Exportar .txt</button>
        <button class="notas-btn danger" id="limparBtn"><i data-lucide="trash-2"></i> Limpar</button>
      </div>
    </div>

    <textarea
      id="notasArea"
      class="notas-textarea"
      placeholder="Digite suas anotações aqui...

Exemplos de uso:
• IP do usuário: 192.168.1.x
• Chamado: #12345
• Problema: ...
• Solução aplicada: ..."
    ></textarea>
  </main>

  <footer class="footer">
    <small>Feito por Geimisson Romário — versão web (simulador)</small>
  </footer>

  <script src="notification.js"></script>
  <script src="notas.js"></script>
  <script src="theme.js"></script>
  <script>if(typeof lucide!=="undefined")lucide.createIcons();</script>
</body>
</html>
